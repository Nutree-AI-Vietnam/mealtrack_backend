name: Build SIT Image

on:
  push:
    branches:
      - delivery
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (default: delivery — :delivery is not pushed until staging deploy succeeds)'
        required: false
        default: 'delivery'

# Serialize staging deploys so overlapping delivery pushes cannot race the
# instance. Do not cancel an in-flight deploy. Migrations are not part of
# this workflow — run .github/workflows/migrate.yml by hand.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Immutable GHCR repo (metadata-action lowercases). Render staging-instance
  # is srv-d7eva9v41pts73f4g390, image-backed.
  SIT_IMAGE: ghcr.io/nutree-ai-vietnam/mealtrack_backend
  STAGING_SERVICE_ID: srv-d7eva9v41pts73f4g390

jobs:
  build-and-push:
    name: 🐳 Build and Push sit-<sha>
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sit-,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag != 'delivery' }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 📊 Image Summary
        run: |
          echo "## 🐳 SIT Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags Published" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Floating \`:delivery\` is **not** pushed here. It is retagged to this digest only after the staging deploy is live. Migrations are not run." >> $GITHUB_STEP_SUMMARY

  # Staging only (push to delivery). Trigger the Render deploy hook for the
  # pinned sit-<sha> image and poll until live. Does not migrate.
  deploy-staging:
    name: 🚀 Deploy staging-instance (sit-${{ github.sha }})
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    outputs:
      verified: ${{ steps.deploy.outputs.verified }}
    steps:
      - name: Trigger Render deploy hook (pinned image)
        id: deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IMAGE: ${{ env.SIT_IMAGE }}:sit-${{ github.sha }}
          STAGING_SERVICE_ID: ${{ env.STAGING_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_STAGING secret is not set"; exit 1
          fi
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "::error::RENDER_API_KEY secret is not set; cannot verify the deploy before retagging :delivery"
            exit 1
          fi
          ENC=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["IMAGE"],safe=""))')
          # Render deploy hook URLs already contain ?key=, so imgURL is appended with &.
          # Do not print HOOK or curl stderr — the hook URL is a secret.
          CODE=$(curl -sS --max-time 20 -o /tmp/resp -w '%{http_code}' -X POST "${HOOK}&imgURL=${ENC}" 2>/tmp/curl.err) || {
            echo "::error::curl failed to reach Render deploy hook"
            exit 1
          }
          if [ "${CODE}" = "401" ] || [ "${CODE}" = "403" ]; then
            echo "::error::Render deploy hook returned HTTP ${CODE} (auth)"
            exit 1
          fi
          if [ "${CODE}" = "202" ]; then
            echo "::error::Render deploy hook returned HTTP 202 (another deploy already running); no deploy id"
            exit 1
          fi
          if [ "${CODE}" -lt 200 ] || [ "${CODE}" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP ${CODE}"; exit 1
          fi
          echo "Deploy triggered for ${IMAGE} (HTTP ${CODE})"

          DEPLOY_ID=$(python3 -c 'import json; d=json.load(open("/tmp/resp")); print((d.get("deploy") or {}).get("id") or "")') || DEPLOY_ID=""
          if [ -z "${DEPLOY_ID}" ]; then
            echo "::error::Render did not return a deploy id (HTTP ${CODE}); failing closed so :delivery is not retagged"
            exit 1
          fi
          echo "Render deploy id: ${DEPLOY_ID}"

          # timeout-minutes: 25. Worst-case poll is curl --max-time 20 + sleep 15.
          # Reserve ~2 minutes for the hook POST and job overhead.
          # (25 * 60 - 120) / (20 + 15) = 39, the approved poll cap.
          POLL_INTERVAL_SECS=15
          CURL_MAX_SECS=20
          MAX_POLLS=$(( (25 * 60 - 120) / (CURL_MAX_SECS + POLL_INTERVAL_SECS) ))
          echo "Polling Render deploy ${DEPLOY_ID} on ${STAGING_SERVICE_ID} (max ${MAX_POLLS} attempts)..."
          i=0
          while [ "${i}" -lt "${MAX_POLLS}" ]; do
            i=$((i + 1))
            POLL_CODE=$(curl -sS --max-time "${CURL_MAX_SECS}" -o /tmp/deploy.json -w '%{http_code}' \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${STAGING_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              2>/tmp/poll.err) || POLL_CODE="000"
            if [ "${POLL_CODE}" = "401" ] || [ "${POLL_CODE}" = "403" ]; then
              echo "::error::Render API returned HTTP ${POLL_CODE} (auth)"
              exit 1
            fi
            STATUS=$(python3 -c 'import json; print(json.load(open("/tmp/deploy.json")).get("status") or "unknown")') || STATUS="unknown"
            echo "Poll ${i}/${MAX_POLLS} HTTP ${POLL_CODE} status=${STATUS}"
            case "${STATUS}" in
              live)
                echo "Render deploy ${DEPLOY_ID} is live"
                echo "verified=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Render deploy ${DEPLOY_ID} failed with status ${STATUS}"
                exit 1
                ;;
            esac
            sleep "${POLL_INTERVAL_SECS}"
          done
          echo "::error::Timed out polling Render deploy ${DEPLOY_ID}"
          exit 1

  # Only after a verified live deploy: move the floating :delivery tag to
  # this digest so a restart uses the image Render reported live.
  promote-delivery-tag:
    name: 🏷️ Point :delivery at sit-${{ github.sha }}
    needs: deploy-staging
    if: github.event_name == 'push' && needs.deploy-staging.outputs.verified == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧰 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag :delivery to the sit-<full sha> digest
        env:
          SRC: ${{ env.SIT_IMAGE }}:sit-${{ github.sha }}
          DST: ${{ env.SIT_IMAGE }}:delivery
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${DST}" "${SRC}"
          echo "Retagged ${DST} to the digest of ${SRC}"
