name: Migrate Database

# Schema pipeline. Manual dispatch for staging|production; also callable from
# ghcr-build-push.yml for staging only (push to delivery). Not used by
# release-pipeline / production deploys.
#
# GitHub Environment `staging` on the migrate job is the auto-migrate gate
# (caller jobs that uses: a reusable workflow cannot set environment:).
# DATABASE_URL_DIRECT is that Environment's secret — not passed via inherit.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment (staging | production)
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: If true, only print migration status (no upgrade)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Required reviewers on this Environment pause auto-migrate until approved.
    environment: ${{ inputs.environment }}
    env:
      PYTHON_VERSION: "3.13.2"
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

    steps:
      - name: 🛡️ Validate environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "${TARGET_ENV}" in
            staging|production) ;;
            *)
              echo "::error::environment must be 'staging' or 'production' (got '${TARGET_ENV}')"
              exit 1
              ;;
          esac
          # Production is dispatch-only. The SIT auto-deploy workflow (push /
          # workflow_call) must never migrate production.
          if [ "${TARGET_ENV}" = "production" ] && [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "::error::production migrate is not allowed when called from another workflow (event=${EVENT_NAME})"
            exit 1
          fi

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Require DATABASE_URL_DIRECT
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ]; then
            echo "::error::DATABASE_URL_DIRECT is empty. Set it on the GitHub Environment '${{ inputs.environment }}' (Neon direct host, not pooler)."
            exit 1
          fi

      - name: 🧭 Migration status (dry run)
        if: ${{ inputs.dry_run }}
        run: python migrations/cli.py status

      - name: ⏩ Apply migrations
        if: ${{ !inputs.dry_run }}
        run: python migrations/run.py

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "## Database migrate"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Mode: \`$( [ '${{ inputs.dry_run }}' = 'true' ] && echo dry_run/status || echo apply )\`"
            echo "- Outcome: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
