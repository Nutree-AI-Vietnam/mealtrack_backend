name: Migrate Database

# Separate schema pipeline — not coupled to Render deploys or release-pipeline.
# Code rollback stays safe because Alembic only runs when this workflow is dispatched.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment (staging | production)
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: If true, only print migration status (no upgrade)
        required: false
        type: boolean
        default: false
      restart_compute:
        description: >-
          Restart the Neon compute after upgrading (~5-15s of DB downtime).
          Required when a migration changes a column type or what a SELECT
          returns: the Neon PgBouncer pooler keeps old prepared statements
          and every query on that table fails with InvalidCachedStatementError
          until its server connections close. Redeploying the app does not fix it.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PYTHON_VERSION: "3.13.18"
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Require DATABASE_URL_DIRECT
        run: |
          if [ -z "${DATABASE_URL_DIRECT}" ]; then
            echo "::error::DATABASE_URL_DIRECT is empty. Set it on the GitHub Environment '${{ inputs.environment }}' (Neon direct host, not pooler)."
            exit 1
          fi

      - name: 🧭 Migration status (dry run)
        if: ${{ inputs.dry_run }}
        run: python migrations/cli.py status

      - name: ⏩ Apply migrations
        if: ${{ !inputs.dry_run }}
        run: python migrations/run.py

      - name: 🔄 Restart Neon compute (drop stale pooler prepared statements)
        if: ${{ !inputs.dry_run && inputs.restart_compute }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_ENDPOINT_ID }}
        run: |
          for name in NEON_API_KEY NEON_PROJECT_ID NEON_ENDPOINT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty. Set it on the GitHub Environment '${{ inputs.environment }}' (NEON_API_KEY as a secret, the IDs as variables)."
              exit 1
            fi
          done
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/endpoints/${NEON_ENDPOINT_ID}/restart" \
            -o /dev/null
          echo "Restarted Neon endpoint ${NEON_ENDPOINT_ID}"

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "## Database migrate"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Mode: \`$( [ '${{ inputs.dry_run }}' = 'true' ] && echo dry_run/status || echo apply )\`"
            echo "- Outcome: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
