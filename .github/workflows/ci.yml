name: CI Pipeline

on:
  push:
    branches: [main, delivery]
  pull_request:
    branches: [main, delivery]

env:
  PYTHON_VERSION: "3.13.2"

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: 🏛️ Architecture Boundaries
        run: lint-imports
        env:
          PYTHONPATH: .

      - name: 🗄️ Validate Migrations & Downgrades
        run: python migrations/cli.py check-downgrades
        env:
          PYTHONPATH: .

      - name: 🧪 Run Unit Tests
        run: |
          pytest \
            tests/unit \
            --ignore=tests/integration \
            -m "not integration" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=65 \
            -v
        env:
          PYTHONPATH: .
          CI: true
          TESTING: true
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: 📁 Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            htmlcov/

  postgres-integration:
    name: 🐘 PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nutree
          POSTGRES_PASSWORD: nutree
          POSTGRES_DB: nutree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutree -d nutree_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nutree:nutree@localhost:5432/nutree_test
      DATABASE_URL: postgresql+psycopg2://nutree:nutree@localhost:5432/nutree_test
      DATABASE_URL_DIRECT: postgresql+psycopg2://nutree:nutree@localhost:5432/nutree_test
      PYTHONPATH: .
      TESTING: true

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: 🗄️ Initialize PostgreSQL Schema
        run: python scripts/init_postgres_db.py

      - name: 🧪 Run PostgreSQL Integration Tests
        run: pytest tests/integration/postgres -o addopts="" -m integration -q
