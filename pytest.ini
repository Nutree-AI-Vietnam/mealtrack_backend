[pytest]
minversion = 6.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
# Fail a hung test instead of blocking the run (pytest-timeout). The slowest
# unit test takes ~2.5 s in CI; override per test with @pytest.mark.timeout.
timeout = 60
# Exclude database config files from test discovery
norecursedirs = src scripts migrations venv
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --ignore=tests/integration
    -m "not integration"
markers =
    api: API integration tests
    unit: Unit tests (fast)
    integration: Integration tests (slow)
    performance: Performance tests
    validation: Validation and error handling tests
    slow: Slow running tests
    fast: Fast running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 